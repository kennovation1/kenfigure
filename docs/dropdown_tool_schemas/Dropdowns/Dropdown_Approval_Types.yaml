Dropdowns:
- Name: Dropdown Approval Types
  Description: Approval types for the Kenfigure Dropdown tool dropdown change requests.
    This dropdown must exist for the tool to function. The tool will
    lookup the name automatically and allows prefixes (e.g., '[Ops]').
    However, if you change the name beyond just the prefix, you must
    configure the name in Kenfigure Tool's "Advanced Settings".
  Alphabetize: false
  Options:
  - Auto-approve     # Request are automatically approved and implemented if they pass validation
  - Community        # One or more community approvers are required to approve the request.
                     # The number of required approvers is configured in the change policy.
  - Community+Admin  # Same as Community, but one or more admin approvers are also required to approve the request.
