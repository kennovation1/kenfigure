  <rect class="blue" x="190" y="322" width="160" height="34" rx="7"/>
  <text class="t" x="270" y="344">Assay Plan</text>

  <line class="arrow" x1="90" y1="57" x2="90" y2="44" marker-end="url(#a)"/>
  <line class="arrow" x1="90" y1="107" x2="90" y2="94" marker-end="url(#a)"/>
