<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img" aria-labelledby="t d">
  <title id="t">The in vivo model, simplified</title>
  <desc id="d">Arrows point from child to parent. Planned from the protocol: Study, Arm, Group, Animal, Schedule, Scheduled Activity, Collection Plan, Assay Plan. Generated by a skill: Activity Event, Sample, Assay Request. Arm links to Study; Group to Arm and to Schedule; Animal to Group; Schedule to Study; Scheduled Activity to Schedule; Collection Plan to Scheduled Activity; Assay Plan to Collection Plan; Activity Event to Animal and to Scheduled Activity; Sample to Activity Event and to Collection Plan; Assay Request to Sample and to Assay Plan.</desc>
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .t { font-size: 13px; font-weight: bold; fill: #000651; }
      .lbl { font-size: 11px; fill: #222222; text-anchor: start; }
      .blue { fill: #C9DEFC; stroke: #5B6B8C; stroke-width: 1.2; }
      .purple { fill: #DDD8FB; stroke: #5B6B8C; stroke-width: 1.2; }
      .white { fill: #FFFFFF; stroke: #5B6B8C; stroke-width: 1.2; }
      .arrow { stroke: #000651; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#000651"/>
    </marker>
  </defs>

  <rect width="360" height="400" rx="10" fill="#FFFFFF"/>

