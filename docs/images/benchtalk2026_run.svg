<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" role="img" aria-labelledby="t d">
  <title id="t">Run: two prompts</title>
  <desc id="d">Scientist plus Benchling AI. The prompt "Create study design from this doc." produces the study design with every registration table filled, then the plan is expanded into every activity event, sample and assay request. The prompt "Set up study for today." produces today's entry with tables pre-filled; the scientist records the data and status. Scientists review and submit. Skills never submit.</desc>
  <defs>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .h { font-size: 20px; font-weight: bold; fill: #000651; text-anchor: start; }
      .sub { font-size: 12px; fill: #222222; text-anchor: start; }
      .t { font-size: 13px; font-weight: bold; fill: #000651; }
      .s { font-size: 11px; font-style: italic; fill: #222222; }
      .p { font-size: 14px; font-weight: bold; font-style: italic; fill: #000651; }
      .f { font-size: 11.5px; font-weight: bold; fill: #000651; }
      .lbl { font-size: 11px; fill: #222222; text-anchor: start; }
      .blue { fill: #C9DEFC; stroke: #5B6B8C; stroke-width: 1.2; }
      .purple { fill: #DDD8FB; stroke: #5B6B8C; stroke-width: 1.2; }
      .white { fill: #FFFFFF; stroke: #000651; stroke-width: 1.2; }
      .arrow { stroke: #000651; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000651"/>
    </marker>
  </defs>

  <rect width="360" height="432" rx="10" fill="#FFFFFF"/>

  <rect class="white" x="8" y="8" width="344" height="416" rx="10"/>
  <text class="h" x="20" y="36">Run</text>
  <text class="sub" x="20" y="53">scientist + Benchling AI: two prompts</text>

  <rect class="white" x="24" y="68" width="312" height="36" rx="6"/>
  <text class="p" x="180" y="91">“Create study design from this doc.”</text>
  <line class="arrow" x1="180" y1="105" x2="180" y2="123" marker-end="url(#a)"/>

  <rect class="blue" x="24" y="124" width="312" height="46" rx="8"/>
  <text class="t" x="180" y="143">Study design</text>
  <text class="s" x="180" y="159">every registration table filled</text>
  <line class="arrow" x1="180" y1="171" x2="180" y2="189" marker-end="url(#a)"/>

  <rect class="purple" x="24" y="190" width="312" height="46" rx="8"/>
  <text class="t" x="180" y="209">Plan expanded</text>
  <text class="s" x="180" y="225">every activity event, sample and assay request</text>

  <rect class="white" x="24" y="258" width="312" height="36" rx="6"/>
  <text class="p" x="180" y="281">“Set up study for today.”</text>
  <line class="arrow" x1="180" y1="295" x2="180" y2="313" marker-end="url(#a)"/>

  <rect class="purple" x="24" y="314" width="312" height="46" rx="8"/>
  <text class="t" x="180" y="333">Today's entry, tables pre-filled</text>
  <text class="s" x="180" y="349">the scientist records the data and status</text>

  <text class="f" x="180" y="384">Scientists review and submit. Skills never submit.</text>

  <rect class="blue" x="34" y="398" width="18" height="12" rx="3"/>
  <text class="lbl" x="58" y="408">planned from the protocol</text>
  <rect class="purple" x="208" y="398" width="18" height="12" rx="3"/>
  <text class="lbl" x="232" y="408">generated by a skill</text>
</svg>
